<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
.chkB { appearance: none; -webkit-appearance: none; width: 13px; height: 13px;
  border: 1.2px solid #2c3e50; background: transparent;
  display: inline-grid; place-content: center; margin: 0; }
.chkB:checked { background-color: #1b3b8c; }
.chkB:checked::after { content: "x"; color: white; font-size: 11px; font-weight: bold; }
</style>
<script type="module">
import html2canvas from 'html2canvas';

const inp = document.getElementById('chk');
const pseudoStyle = getComputedStyle(inp, '::after');
const results = [];

async function probe(el) {
  try {
    await html2canvas(el, { scale: 1, backgroundColor: '#ffffff' });
    return 'OK';
  } catch (e) {
    return 'ERR ' + (e && e.message);
  }
}

setTimeout(async function () {
  const props = [];
  for (let i = 0; i < pseudoStyle.length; i++) props.push(pseudoStyle[i]);
  for (const p of props) {
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:absolute; top:-9999px; left:0;';
    const el = document.createElement('div');
    el.style[p] = pseudoStyle.getPropertyValue(p);
    wrapper.appendChild(el);
    document.body.appendChild(wrapper);
    const r = await probe(wrapper);
    wrapper.remove();
    if (r !== 'OK') {
      results.push(p + ' => ' + r + '  [value: ' + pseudoStyle.getPropertyValue(p) + ']');
    }
  }
  document.getElementById('out').textContent = results.join('\n') || 'no single property fails?!';
  document.title = 'DONE';
}, 200);
</script>
</head>
<body>
<input type="checkbox" id="chk" class="chkB" checked />
<pre id="out">running</pre>
</body>
</html>
