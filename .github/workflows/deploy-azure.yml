# Deploy Image2Webhook to the existing Azure Web App (i2w-app-6291a5).
# Does not create resources, change App Settings, or scale the plan.
name: Deploy Azure

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - app.py
      - static/**
      - frontend/**
      - .github/workflows/deploy-azure.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-prod
  cancel-in-progress: false

env:
  RG: rg-image2webhook
  ACR: i2w6291a5
  APP: i2w-app-6291a5
  PLAN: plan-image2webhook

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image, update Web App, restart
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            CAPACITY=$(az appservice plan show \
              --name "$PLAN" \
              --resource-group "$RG" \
              --query sku.capacity \
              -o tsv)
            if [[ "$CAPACITY" != "1" ]]; then
              echo "ERROR: plan $PLAN capacity is $CAPACITY (must be 1). Refusing to deploy." >&2
              exit 1
            fi

            IMAGE="image2webhook:sha-${GITHUB_SHA::7}"
            echo "Building $IMAGE in ACR $ACR …"

            az acr build --registry "$ACR" --image "$IMAGE" .

            ACR_LOGIN=$(az acr show -n "$ACR" --query loginServer -o tsv)

            az webapp config container set \
              --resource-group "$RG" \
              --name "$APP" \
              --docker-custom-image-name "$ACR_LOGIN/$IMAGE"

            az webapp restart --resource-group "$RG" --name "$APP"

            echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Wait for health
        run: |
          set -euo pipefail
          URL="https://${APP}.azurewebsites.net/api/health"
          echo "Polling $URL (image ${IMAGE:-unknown}) …"
          for i in $(seq 1 30); do
            BODY=$(curl -fsS "$URL" 2>/dev/null || true)
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "Health OK: $BODY"
              exit 0
            fi
            echo "  attempt $i/30 …"
            sleep 10
          done
          echo "ERROR: health check did not return status ok" >&2
          exit 1
